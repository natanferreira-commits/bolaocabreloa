# Deploy na Netlify. O site é 100% estático: "next build" com output: "export" gera a pasta out/.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # Não usar o runtime de Next.js da Netlify: aqui é só HTML/JS estático publicado de out/
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
